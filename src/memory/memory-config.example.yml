# memory-config.example.yml — copy to memory-config.yml and edit
server:
  port: 8422

neo4j:
  uri: bolt://localhost:7687
  user: neo4j
  password: ${oc.env:NEO4J_PASSWORD,neo4j}

storage:
  postgres_dsn: ${oc.env:MEMORY_PG_DSN,postgres://memory:memory@localhost:5432/memory}

llm:
  client_class: memory.llm.DefaultLLMClient
  api_key: ${oc.env:ANTHROPIC_API_KEY,}
  base_url: https://api.anthropic.com
  model: claude-haiku-4-5-20251001

# Embedder — local sentence-transformers (default) or OpenAI
embedder:
  embedder_class: memory.embedder.LocalEmbedder
  model: all-MiniLM-L6-v2
  embedding_dim: 384
# OpenAI embedder (requires OPENAI_API_KEY):
# embedder:
#   embedder_class: memory.embedder.OpenAIEmbedderWrapper
#   api_key: ${oc.env:OPENAI_API_KEY,}
#   model: text-embedding-3-small
#   embedding_dim: 1536

queue:
  max_attempts: 3
  base_delay_seconds: 5
  worker_concurrency: 1

# Prometheus metrics + periodic llm_usage_summary log (ADR 0050, 0051).
# /metrics is unauthenticated; restart-only (the memory service has no hot-reload).
metrics:
  enabled: true
  endpoint: /metrics
  summary_log: true
  summary_interval_seconds: 30

logging:
  level: INFO
  timezone: America/Los_Angeles

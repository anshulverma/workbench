[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.1",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.1",
    "graphiti-core[anthropic]>=0.30.2",
    "asyncpg>=0.32.0",
    "httpx>=0.28.1",
    "omegaconf>=2.4.0",
    "PyYAML>=6.0.3",
    "structlog>=26.1.0",
    "prometheus-client>=0.26.0",
]

[project.optional-dependencies]
local-embedder = [
    "sentence-transformers>=6.1.0",
]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["memory*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

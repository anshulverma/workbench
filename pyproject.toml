[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "workbench"
version = "0.2.1"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.1",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.1",
    "asyncpg>=0.32.0",
    "alembic>=1.20.0",
    "anthropic>=1.14.0",
    "apscheduler>=3.11.3",
    "httpx>=0.28.1",
    "omegaconf>=2.4.0",
    "PyYAML>=6.0.3",
    "ruamel.yaml>=0.19.1",
    "sqlalchemy[asyncio]>=2.1.4",
    "google-api-python-client>=2.201.0",
    "google-auth>=2.62.0",
    "google-auth-httplib2>=0.4.4",
    "structlog>=26.1.0",
    "prometheus-client>=0.26.0",
    "rich>=15.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
    "rich>=15.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

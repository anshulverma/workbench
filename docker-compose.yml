# docker-compose.yml
services:
  postgres:
    image: docker.io/library/postgres:17
    network_mode: host
    entrypoint: ["sh", "-c"]
    command: ["docker-entrypoint.sh postgres -c log_timezone=America/Los_Angeles -c timezone=America/Los_Angeles 2>&1 | tee -a /var/log/app/postgres.log"]
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
      - ./data/logs:/var/log/app
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      TZ: America/Los_Angeles
      PGTZ: America/Los_Angeles

  neo4j:
    image: docker.io/library/neo4j:5-community
    network_mode: host
    entrypoint: ["sh", "-c"]
    command: ["/startup/docker-entrypoint.sh neo4j 2>&1 | tee -a /var/log/app/neo4j.log"]
    volumes:
      - ./data/neo4j:/data
      - ./data/logs:/var/log/app
      - ./neo4j-user-logs.xml:/var/lib/neo4j/conf/user-logs.xml
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-workbench}
      NEO4J_PLUGINS: '["apoc"]'
      TZ: America/Los_Angeles
      NEO4J_dbms_db_timezone: SYSTEM

  memory:
    image: workbench_memory
    build:
      context: ./src/memory
    network_mode: host
    command: ["sh", "-c", "uvicorn memory.main:app --host 0.0.0.0 --port 8422 --no-access-log --log-level warning 2>&1 | tee -a /app/logs/memory.log"]
    depends_on:
      - postgres
      - neo4j
    volumes:
      - ./data/logs:/app/logs
    environment:
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-workbench}
      MEMORY_PG_DSN: postgres://memory:memory@localhost:5432/memory
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GRAPHITI_TELEMETRY_ENABLED: "false"

  workbench:
    build: .
    network_mode: host
    depends_on:
      - postgres
      - memory
    volumes:
      - ./data/logs:/app/logs
    environment:
      WORKBENCH_API_TOKEN: ${WORKBENCH_API_TOKEN:-dev-token}
      WORKBENCH_POSTGRES_DSN: postgres://workbench:workbench@localhost:5432/workbench
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}

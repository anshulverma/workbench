# docker-compose.yml
services:
  postgres:
    image: docker.io/library/postgres:17
    network_mode: host
    entrypoint: ["sh", "-c"]
    command: ["docker-entrypoint.sh postgres -c log_timezone=America/Los_Angeles -c timezone=America/Los_Angeles -c log_line_prefix='%m [%p] %q%u@%d ' 2>&1 | tee -a /var/log/app/postgres.log"]
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
      - ./data/logs:/var/log/app
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      TZ: America/Los_Angeles
      PGTZ: America/Los_Angeles

  neo4j:
    image: docker.io/library/neo4j:5-community
    network_mode: host
    entrypoint: ["sh", "-c"]
    command: ["/startup/docker-entrypoint.sh neo4j 2>&1 | tee -a /var/log/app/neo4j.log"]
    volumes:
      - ./data/neo4j:/data
      - ./data/logs:/var/log/app
      - ./neo4j-user-logs.xml:/var/lib/neo4j/conf/user-logs.xml
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-workbench}
      NEO4J_PLUGINS: '["apoc"]'
      TZ: America/Los_Angeles
      NEO4J_dbms_db_timezone: SYSTEM

  memory:
    image: workbench_memory
    build:
      context: ./src/memory
    network_mode: host
    init: true
    stop_grace_period: 5s
    command: ["sh", "-c", "uvicorn memory.main:app --host 0.0.0.0 --port 8422 --no-access-log --log-level warning"]
    depends_on:
      - postgres
      - neo4j
    volumes:
      - ./data/logs:/app/logs
    environment:
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-workbench}
      MEMORY_PG_DSN: postgres://memory:memory@localhost:5432/memory
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GRAPHITI_TELEMETRY_ENABLED: "false"

  workbench:
    build: .
    network_mode: host
    depends_on:
      - postgres
      - memory
    volumes:
      - ./data/logs:/app/logs
    environment:
      WORKBENCH_API_TOKEN: ${WORKBENCH_API_TOKEN:-dev-token}
      WORKBENCH_POSTGRES_DSN: postgres://workbench:workbench@localhost:5432/workbench
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}

  # Observability stack (ADR 0051). Scrapes the unauthenticated /metrics on the
  # workbench (:8421) and memory (:8422) services; Grafana plugs in on :3000.
  # Bound to loopback via host networking — reach over the same SSH tunnel.
  prometheus:
    image: docker.io/prom/prometheus:latest
    network_mode: host
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.listen-address=127.0.0.1:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus:/prometheus
    depends_on:
      - workbench
      - memory

  grafana:
    image: docker.io/grafana/grafana:latest
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3000"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

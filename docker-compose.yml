# docker-compose.yml
services:
  postgres:
    image: postgres:17
    network_mode: host
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres

  neo4j:
    image: neo4j:5-community
    network_mode: host
    volumes:
      - ./data/neo4j:/data
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-neo4j}
      NEO4J_PLUGINS: '["apoc"]'

  memory:
    build:
      context: ./src/memory
    network_mode: host
    depends_on:
      - postgres
      - neo4j
    environment:
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4j}
      MEMORY_PG_DSN: postgres://memory:memory@localhost:5432/memory
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GRAPHITI_TELEMETRY_ENABLED: "false"

  workbench:
    build: .
    network_mode: host
    depends_on:
      - postgres
      - memory
    volumes:
      - ./data/logs:/app/logs
    environment:
      WORKBENCH_API_TOKEN: ${WORKBENCH_API_TOKEN:-dev-token}
      WORKBENCH_POSTGRES_DSN: postgres://workbench:workbench@localhost:5432/workbench
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}

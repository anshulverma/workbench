# config.example.yml — copy to config.yml and edit
version: "0.4.0"

server:
  port: 8421
  debug: false
  api_token: ${oc.env:WORKBENCH_API_TOKEN,change-me}

storage:
  postgres_dsn: ${oc.env:WORKBENCH_POSTGRES_DSN,postgres://workbench:workbench@localhost:5432/workbench}

llm:
  class: workbench.providers.llm.anthropic.AnthropicLLM
  api_key: ${oc.env:ANTHROPIC_API_KEY}
  model: claude-sonnet-4-20250514

logging:
  level: INFO
  log_dir: ${oc.env:WORKBENCH_LOG_DIR,logs}
  max_bytes: 10485760    # 10 MB
  max_age_days: 84       # 12 weeks
  timezone: America/Los_Angeles

queue:
  scorer:
    class: workbench.providers.queue_scorer.llm.LLMQueueScorer
    api_key: ${oc.env:ANTHROPIC_API_KEY}
    model: claude-haiku-4-5-20251001
  worker_concurrency: 2
  max_attempts: 3
  base_delay_seconds: 5

triage:
  daily_cap: 20
  expiry_days: 7
  timeout_minutes: 30
  triage_poll_interval_seconds: 5.0

pipeline:
  include_threshold: 70
  drop_threshold: 30
  confidence_threshold: 70

scheduler:
  poll_interval_minutes: 15
  morning_briefing_hour: 9

# Messenger — Google Chat (production) or Console (local dev)
messenger:
  class: workbench.providers.messenger.console.ConsoleMessenger
# Google Chat:
# messenger:
#   class: workbench.providers.messenger.google_chat.GoogleChatMessenger
#   space_id: ${oc.env:GOOGLE_CHAT_SPACE_ID}
#   service_account_key_path: ${oc.env:GOOGLE_CHAT_SA_KEY_PATH,/app/credentials/chat-sa.json}

